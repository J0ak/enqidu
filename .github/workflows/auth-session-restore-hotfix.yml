name: Verify auth session restore hotfix

on:
  push:
    branches:
      - fix/auth-session-restore-activities
    paths:
      - .github/workflows/auth-session-restore-hotfix.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/auth-session-restore-activities
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply auth restore patch
        run: |
          if grep -q 'Auth session restore failed' src/main.jsx; then
            echo "Patch already present"
          else
            python3 scripts/patch-auth-session-restore.py
            python3 scripts/restore-main-line-endings.py
          fi

      - name: Guard scoped diff
        run: |
          git diff --numstat origin/main -- src/main.jsx
          changed=$(git diff --numstat origin/main -- src/main.jsx | awk '{print $1+$2}')
          test -n "$changed"
          test "$changed" -lt 120

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore expired auth session before loading activities"
          git push origin HEAD:fix/auth-session-restore-activities
