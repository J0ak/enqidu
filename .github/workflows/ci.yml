name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coach contract evals
        run: npm run test:coach-evals
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Prepare isolated local Supabase project
        run: |
          rm -rf e2e-local/supabase/functions e2e-local/src
          cp -R supabase/functions e2e-local/supabase/functions
          cp -R src e2e-local/src
      - name: Start and rebuild isolated local Supabase
        run: |
          supabase --workdir e2e-local start
          supabase --workdir e2e-local db reset
          node e2e-local/bootstrap-health-intelligence.mjs
          node e2e-local/bootstrap-browser-read-contract.mjs
          node e2e-local/bootstrap-transactional-actions.mjs
          supabase --workdir e2e-local status -o env > /tmp/supabase.env
          cat > e2e-local/supabase/.env.e2e <<'EOF'
          OPENAI_COACH_ENABLED=false
          EOF
          nohup supabase --workdir e2e-local functions serve --env-file e2e-local/supabase/.env.e2e > /tmp/supabase-functions.log 2>&1 &
      - name: Export local-only Supabase values
        run: |
          source /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Wait for local Coach functions
        run: |
          source /tmp/supabase.env
          for attempt in {1..30}; do
            if curl -fsS -X OPTIONS "$API_URL/functions/v1/coach-reply" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/supabase-functions.log || true
          exit 1
      - name: Transactional action acceptance and real PostgreSQL races
        env:
          ENQIDU_TRANSACTION_LOCAL: "1"
          ENQIDU_TRANSACTION_ENV_FILE: /tmp/supabase.env
        run: npm run test:transactional-actions
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show Edge Function logs on failure
        if: failure()
        run: cat /tmp/supabase-functions.log || true
      - name: Stop isolated local Supabase
        if: always()
        run: supabase --workdir e2e-local stop --no-backup
