name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coach contract evals
        run: npm run test:coach-evals
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    needs: test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start and rebuild local Supabase
        run: |
          supabase start
          supabase db reset
          supabase status -o env > /tmp/supabase.env
          cat > supabase/.env.e2e <<'EOF'
          OPENAI_COACH_ENABLED=false
          EOF
          nohup supabase functions serve --env-file supabase/.env.e2e > /tmp/supabase-functions.log 2>&1 &
      - name: Export local-only Supabase values
        run: |
          source /tmp/supabase.env
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show Edge Function logs on failure
        if: failure()
        run: cat /tmp/supabase-functions.log || true
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
