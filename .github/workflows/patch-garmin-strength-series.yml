name: Patch Garmin strength series

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-garmin-strength-series.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/garmin-strength-series
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rebuild main.jsx patch from clean main
        run: |
          git checkout origin/main -- src/main.jsx
          python3 scripts/patch-garmin-strength-series.py
          python3 scripts/restore-main-line-endings.py

      - name: Guard scoped diff size
        run: |
          git diff --numstat origin/main -- src/main.jsx
          changed=$(git diff --numstat origin/main -- src/main.jsx | awk '{print $1+$2}')
          test -n "$changed"
          test "$changed" -lt 500

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Report whitespace diagnostics
        run: git diff --check --ignore-space-at-eol || true

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve and show Garmin strength series"
          git push origin HEAD:fix/garmin-strength-series
